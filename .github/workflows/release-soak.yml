name: Release Production Soak

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-soak:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run 1,000-match production soak
        run: npm run test:production-soak

      - name: Upload production soak report
        uses: actions/upload-artifact@v4
        with:
          name: production-soak-report
          path: tmp/production-soak-report.json
          if-no-files-found: error
